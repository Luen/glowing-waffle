name: glowing_waffle
description: Client-side TTS app that reads aloud text and websites using Kokoro and Kitten TTS.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  flutter_riverpod: ^3.0.0
  webview_flutter: ^4.10.0
  sherpa_onnx: ^1.12.26
  path_provider: ^2.1.2
  just_audio: ^0.10.0
  archive: ^4.5.2
  # sha256 of the downloaded model archive (lib/tts/model_store.dart).
  crypto: ^3.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  # Deliberately no assets: the Kokoro model (~360 MB) is downloaded on first
  # run into the app support directory instead of being bundled, which is what
  # kept web builds and native bundles huge (issue #7). Declaring
  # `assets: [assets/tts/]` again opts a dev build back into bundling, which
  # lib/tts/tts_engine_mobile.dart detects and imports without downloading.
