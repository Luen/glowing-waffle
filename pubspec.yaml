name: glowing_waffle
description: Client-side TTS app that reads aloud text and websites using Kokoro and Kitten TTS.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  flutter_riverpod: ^3.0.0
  webview_flutter: ^4.10.0
  sherpa_onnx: ^1.12.26
  path_provider: ^2.1.2
  just_audio: ^0.10.0
  archive: ^4.5.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/tts/
