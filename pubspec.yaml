name: glowing_waffle
description: Client-side TTS app that reads aloud text and websites using Kokoro and Kitten TTS.
publish_to: 'none'
version: 1.0.1+2

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.9
  flutter_riverpod: ^3.4.3
  webview_flutter: ^4.14.1
  sherpa_onnx: ^1.13.8
  path_provider: ^2.1.6
  just_audio: ^0.10.6
  archive: ^4.5.2
  # sha256 of the downloaded model archive (lib/tts/model_store.dart).
  crypto: ^3.0.8
  share_plus: ^13.3.1
  shared_preferences: ^2.5.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  # Deliberately no assets: the speech models (Kokoro ~360 MB, Kitten ~25 MB)
  # are downloaded on first run into the app support directory instead of being
  # bundled, which is what kept web builds and native bundles huge (issues #6,
  # #7). Declaring `assets: [assets/tts/]` or `[assets/tts_kitten/]` again opts
  # a dev build back into bundling that model, which
  # lib/tts/tts_engine_mobile.dart detects and imports without downloading.
