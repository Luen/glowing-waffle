name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  flutter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - run: flutter build web

  tts-smoke:
    # End-to-end CPU synthesis with the same models/config as the native app
    # (Kokoro and the smaller Kitten) and the same kokoro-js model + audio
    # handling as the web bridge.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/cache@v6
        with:
          path: ~/.cache/glowing-waffle
          key: tts-models-kokoro-multi-lang-v1_0-kitten-nano-en-v0_2-fp16
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - run: pip install -r scripts/requirements.txt
      - run: scripts/download_kokoro.sh
      - run: scripts/download_kokoro.sh --kitten
      - run: python scripts/smoke_tts.py --out native-smoke.wav
      - run: python scripts/smoke_tts.py --engine kitten --out kitten-smoke.wav
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: npm ci && node smoke.mjs ../../web-smoke.wav
        working-directory: scripts/web_smoke
      - uses: actions/upload-artifact@v7
        with:
          name: smoke-audio
          path: '*-smoke.wav'

  android-build:
    # Release-mode Gradle build on a clean runner: unit tests never touch AGP,
    # the NDK or plugin build scripts (issue #8). arm64-only, like the release
    # workflow (issue #40).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build apk --release --target-platform android-arm64

  apple-build:
    # macOS and iOS builds need Xcode, so they used to be verified only on the
    # maintainer's machine (issue #8). The iOS build is unsigned on purpose:
    # CI has no certificates or provisioning profiles (issue #11).
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build macos --release
      - run: flutter build ios --no-codesign --release
