name: Release builds

# Builds the app for every platform when a GitHub Release is published and
# attaches the results to that release. Run it manually (workflow_dispatch) to
# get the same builds as workflow artifacts; give a tag to also upload them to
# that existing release.
#
# The model (~350 MB) is not bundled any more: the app downloads it on first
# run into its support directory (issue #7), so no build step needs
# scripts/download_kokoro.sh and the artifacts stay small. Builds are unsigned;
# see the signing issue for secrets.

on:
  release:
    types: [published]
  # Validate changes to this workflow by building (no upload) on the PR.
  pull_request:
    paths: ['.github/workflows/release.yml']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to upload to (leave empty for artifacts only)
        required: false
        default: ''

permissions:
  contents: write

env:
  TAG: ${{ github.event.release.tag_name || inputs.tag }}

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      # arm64-v8a only (issue #40): the models are CPU-bound and 32-bit/x86
      # builds are not realistic targets. Flutter always passes its own
      # target platforms to Gradle, so the flag (not abiFilters) is what picks
      # the ABI; the check below keeps a future edit from shipping the 126 MB
      # universal APK by accident.
      - run: flutter build apk --release --target-platform android-arm64
      - run: flutter build appbundle --release --target-platform android-arm64
      - name: Check the APK is arm64-only
        run: |
          abis=$(unzip -l build/app/outputs/flutter-apk/app-release.apk \
            | awk '{print $4}' | grep '^lib/' | cut -d/ -f2 | sort -u)
          echo "ABIs: $abis"
          test "$abis" = "arm64-v8a"
      - name: Collect
        run: |
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk dist/glowing-waffle-android-arm64-v8a.apk
          cp build/app/outputs/bundle/release/app-release.aab dist/glowing-waffle-android.aab
          ls -lh dist
      - uses: actions/upload-artifact@v7
        with:
          name: android
          path: dist/*

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      # No model download: web loads Kokoro from the CDN via kokoro-js.
      - run: flutter pub get
      - run: flutter build web --release
      - run: mkdir -p dist && (cd build/web && zip -qr ../../dist/glowing-waffle-web.zip .) && ls -lh dist
      - uses: actions/upload-artifact@v7
        with:
          name: web
          path: dist/*

  linux:
    # Experimental: no linux/ folder is committed, so it is generated here.
    # The Web Reader tab (webview_flutter) is unsupported on Linux.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ninja-build libgtk-3-dev clang cmake pkg-config liblzma-dev
      - run: flutter create --platforms=linux --org dev.luen --project-name glowing_waffle .
      - run: flutter pub get
      - run: flutter build linux --release
      - run: mkdir -p dist && tar -C build/linux/x64/release/bundle -czf dist/glowing-waffle-linux-x64.tar.gz . && ls -lh dist
      - uses: actions/upload-artifact@v7
        with:
          name: linux
          path: dist/*

  windows:
    # Experimental: windows/ is generated here; Web Reader is unsupported.
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter create --platforms=windows --org dev.luen --project-name glowing_waffle .
      - run: flutter pub get
      - run: flutter build windows --release
      - shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath dist/glowing-waffle-windows-x64.zip
          Get-ChildItem dist
      - uses: actions/upload-artifact@v7
        with:
          name: windows
          path: dist/*

  apple:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - name: macOS (unsigned)
        run: flutter build macos --release
      - name: iOS (no codesign)
        run: flutter build ios --release --no-codesign
      - name: Collect
        run: |
          mkdir -p dist
          ditto -c -k --keepParent "build/macos/Build/Products/Release/glowing_waffle.app" dist/glowing-waffle-macos-unsigned.zip
          mkdir -p Payload && cp -R build/ios/iphoneos/Runner.app Payload/
          zip -qr dist/glowing-waffle-ios-unsigned.ipa Payload
          ls -lh dist
      - uses: actions/upload-artifact@v7
        with:
          name: apple
          path: dist/*

  publish:
    needs: [android, web, linux, windows, apple]
    # Upload whatever built; experimental desktop failures don't block the rest.
    if: ${{ !cancelled() && (github.event_name == 'release' || inputs.tag != '') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - run: ls -lh dist
      - uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.TAG }}
          files: dist/*
          fail_on_unmatched_files: false
