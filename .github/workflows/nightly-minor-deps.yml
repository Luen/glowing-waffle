# Nightly in-major dependency refresh on `main`.
#
# Raises caret ranges in pubspec.yaml and scripts/*/package.json to the newest
# release that stays inside each dependency's current major (0.x only takes
# patches), skipping versions published in the last COOLDOWN_DAYS so a
# hijacked release has time to be yanked. Constraint files are the intentional
# edit; lockfiles are re-resolved so CI can still `pub get` / `npm ci`.
# `kokoro-js` is excluded (bridge CDN pin must move with the smoke package).
#
# Pushes straight to `main`. Tags and the GHCR web image stay manual
# (publish a GitHub Release). No-op when nothing moved.

name: Nightly minor deps

on:
  schedule:
    - cron: '27 14 * * *' # ~00:27 AEST (offset from Paluma)
  workflow_dispatch:

concurrency:
  group: nightly-minor-deps-${{ github.repository }}
  cancel-in-progress: true

permissions:
  contents: write

env:
  COOLDOWN_DAYS: 3

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout main
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Raise in-major ranges (3-day cooldown)
        run: python scripts/update_minor_deps.py --cooldown-days "${COOLDOWN_DAYS}"

      - name: Detect constraint-file changes
        id: changes
        run: |
          set -euo pipefail
          if git diff --quiet -- \
              pubspec.yaml pubspec.lock \
              scripts/branding/package.json \
              scripts/branding/package-lock.json \
              scripts/web_smoke/package.json \
              scripts/web_smoke/package-lock.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "All dependency ranges already at the newest cooled in-major release."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            git diff -- \
              pubspec.yaml pubspec.lock \
              scripts/branding/package.json \
              scripts/branding/package-lock.json \
              scripts/web_smoke/package.json \
              scripts/web_smoke/package-lock.json
          fi

      - name: Analyze and test
        if: steps.changes.outputs.changed == 'true'
        run: |
          flutter pub get
          dart format --output=none --set-exit-if-changed .
          flutter analyze
          flutter test
          flutter build web
          node --check web/tts_bridge.js

      - name: Branding npm ci
        if: steps.changes.outputs.changed == 'true'
        run: npm ci
        working-directory: scripts/branding

      - name: Web smoke npm ci
        if: steps.changes.outputs.changed == 'true'
        run: npm ci
        working-directory: scripts/web_smoke

      - name: Commit and push to main
        if: steps.changes.outputs.changed == 'true'
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            pubspec.yaml pubspec.lock \
            scripts/branding/package.json \
            scripts/branding/package-lock.json \
            scripts/web_smoke/package.json \
            scripts/web_smoke/package-lock.json
          git commit -m "chore(deps): nightly in-major dependency update"
          # A PR may have landed on main while tests ran.
          git pull --rebase origin main
          git push origin HEAD:main
