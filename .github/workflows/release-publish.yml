# Build and push the GHCR web image for a published GitHub Release.
#
# The nightly job (nightly-minor-deps-release.yml) cuts a Release when
# dependency ranges moved; hand-cut releases use the same path. Release events
# run the workflow from the DEFAULT branch, so keep this file present on `dev`
# as well as `main`. The build itself always checks out the release tag.
# Prereleases are skipped so they cannot move `:latest`.

name: Publish release image

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to build and push (e.g. v1.0.1)
        required: true
        type: string
  pull_request:
    paths:
      - Dockerfile
      - Caddyfile
      - .dockerignore
      - docker-compose.yml
      - .github/workflows/release-publish.yml

concurrency:
  group: release-publish-${{ github.event.release.tag_name || inputs.tag || github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  publish:
    # Prereleases must not move the `:latest` tag. PR smoke builds still run.
    if: >
      github.event_name == 'pull_request' ||
      github.event_name == 'workflow_dispatch' ||
      github.event.release.prerelease == false
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Resolve tag
        id: tag
        run: |
          set -euo pipefail
          if [[ "${GITHUB_EVENT_NAME}" == "pull_request" ]]; then
            echo "tag=" >> "$GITHUB_OUTPUT"
            echo "version=pr-${GITHUB_RUN_ID}" >> "$GITHUB_OUTPUT"
            echo "push=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          TAG="${{ github.event.release.tag_name || inputs.tag }}"
          if [ -z "$TAG" ]; then
            echo "Could not resolve a release tag" >&2
            exit 1
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"
          echo "push=true" >> "$GITHUB_OUTPUT"
          echo "Publishing ${TAG}"

      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ steps.tag.outputs.tag || github.ref }}
          fetch-depth: 0

      - name: Resolve commit
        id: commit
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Image tags
        id: version
        run: |
          set -euo pipefail
          VERSION="${{ steps.tag.outputs.version }}"
          PUSH="${{ steps.tag.outputs.push }}"
          TAGS="ghcr.io/luen/glowing-waffle-web:${VERSION}"
          if [[ "${PUSH}" == "true" && "${VERSION}" != *-* ]]; then
            TAGS="${TAGS}"$'\n'"ghcr.io/luen/glowing-waffle-web:latest"
          fi
          echo "name=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "push=${PUSH}" >> "$GITHUB_OUTPUT"
          echo "tags<<EOF" >> "$GITHUB_OUTPUT"
          echo "${TAGS}" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"
          echo "Building web image ${VERSION} (push=${PUSH})"

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: steps.version.outputs.push == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build amd64 image for smoke test
        uses: docker/build-push-action@v6
        env:
          DOCKER_BUILD_RECORD_UPLOAD: false
        with:
          context: .
          platforms: linux/amd64
          push: false
          load: true
          tags: waffle-web:smoke
          cache-from: type=gha,scope=waffle-web
          cache-to: type=gha,mode=max,scope=waffle-web

      - name: Smoke test
        run: |
          docker run -d --name waffle-web -p 8099:80 waffle-web:smoke
          for i in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:8099/ > /tmp/waffle-index.html; then
              break
            fi
            sleep 2
          done
          grep -q "Waffle" /tmp/waffle-index.html
          curl -fsSI http://127.0.0.1:8099/flutter_service_worker.js \
            | grep -qi "cache-control: no-cache"
          docker rm -f waffle-web

      - name: Build and push multi-arch image
        if: steps.version.outputs.push == 'true'
        uses: docker/build-push-action@v6
        env:
          DOCKER_BUILD_RECORD_UPLOAD: false
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.version.outputs.tags }}
          cache-from: type=gha,scope=waffle-web
          cache-to: type=gha,mode=max,scope=waffle-web
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ steps.commit.outputs.sha }}
            org.opencontainers.image.version=${{ steps.version.outputs.name }}

      - name: Clean up on failure
        if: failure()
        run: docker rm -f waffle-web || true
