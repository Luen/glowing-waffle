name: Web image (GHCR)

# Builds the Flutter web app into a multi-arch Caddy image
# (linux/amd64 + linux/arm64) and optionally pushes it to GHCR for the Odroid
# home server (Cloudflare tunnel → :8099 → waffle.luenwarneke.com).

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: Image tag to push (e.g. 1.0.0)
        required: true
        default: 1.0.0
      push_web_image:
        description: Push the multi-arch image to GHCR
        type: boolean
        default: true
  pull_request:
    paths:
      - Dockerfile
      - Caddyfile
      - .dockerignore
      - docker-compose.yml
      - .github/workflows/web-image.yml

permissions:
  contents: read

concurrency:
  group: web-image-${{ github.ref }}
  cancel-in-progress: false

jobs:
  docker:
    name: Web image (GHCR)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - name: Resolve version
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
          PUSH_WEB_IMAGE: ${{ inputs.push_web_image }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          if [[ "${GITHUB_EVENT_NAME}" == "release" ]]; then
            VERSION="${RELEASE_TAG#v}"
            PUSH=true
          elif [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            VERSION="${INPUT_VERSION}"
            PUSH="${PUSH_WEB_IMAGE}"
          else
            VERSION="pr-${GITHUB_RUN_ID}"
            PUSH=false
          fi
          echo "name=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "push=${PUSH}" >> "$GITHUB_OUTPUT"
          TAGS="ghcr.io/luen/glowing-waffle-web:${VERSION}"
          if [[ "${VERSION}" != *-* ]]; then
            TAGS="${TAGS}"$'\n'"ghcr.io/luen/glowing-waffle-web:latest"
          fi
          echo "tags<<EOF" >> "$GITHUB_OUTPUT"
          echo "${TAGS}" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"
          echo "Building web image ${VERSION} (push=${PUSH})"
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: steps.version.outputs.push == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Multi-arch manifests cannot be loaded into the local docker daemon, so
      # smoke-test an amd64 image first, then (on release / explicit push)
      # publish amd64 + arm64.
      - name: Build amd64 image for smoke test
        uses: docker/build-push-action@v6
        env:
          DOCKER_BUILD_RECORD_UPLOAD: false
        with:
          context: .
          platforms: linux/amd64
          push: false
          load: true
          tags: waffle-web:smoke
          cache-from: type=gha,scope=waffle-web
          cache-to: type=gha,mode=max,scope=waffle-web
      - name: Smoke test
        run: |
          docker run -d --name waffle-web -p 8099:80 waffle-web:smoke
          for i in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:8099/ > /tmp/waffle-index.html; then
              break
            fi
            sleep 2
          done
          grep -q "Waffle" /tmp/waffle-index.html
          curl -fsSI http://127.0.0.1:8099/flutter_service_worker.js \
            | grep -qi "cache-control: no-cache"
          docker rm -f waffle-web
      - name: Build and push multi-arch image
        if: steps.version.outputs.push == 'true'
        uses: docker/build-push-action@v6
        env:
          DOCKER_BUILD_RECORD_UPLOAD: false
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.version.outputs.tags }}
          cache-from: type=gha,scope=waffle-web
          cache-to: type=gha,mode=max,scope=waffle-web
      - name: Clean up on failure
        if: failure()
        run: docker rm -f waffle-web || true
